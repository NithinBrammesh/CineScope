services:
  postgres:
    image: postgres:16-alpine
    container_name: cinescope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinescope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cinescope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinescope"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cinescope_pgdata:
